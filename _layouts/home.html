---
layout: default
---

<div class="home-header">
  <picture>
    <source srcset="{{ "/assets/images/avatar-dark.png" | relative_url }}" media="(prefers-color-scheme: dark)">
    <img src="{{ "/assets/images/avatar-light.png" | relative_url }}" alt="avatar" class="avatar">
  </picture>
  <h1 class="visually-hidden">{{ site.title }}</h1>
  <p>{{ site.description }}</p>
</div>

<div class="posts-feed">
  {% for post in site.posts %}
    <article class="post">
      <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
      {{ post.content }}
    </article>
  {% endfor %}
</div>
